<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <nav class="navbar">
            <span class="app-link">Get the App</span>
            <div class="nav-links">
                <a href="#">Add restaurant</a>
                <a href="#">Log in</a>
                <a href="#">Sign up</a>
            </div>
        </nav>
        <div class="hero-content">
            <h1 class="logo">zomato</h1>
            <p class="tagline">Discover the best food & drinks in your city</p>
            <div class="search-box">
                <input type="text" placeholder="📍 Bengaluru" class="loc-input">
                <input type="text" placeholder="🔍 Search for restaurant, cuisine or a dish" class="search-input">
            </div>
        </div>
    </header>
</body>
</html>
